<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="20" fill="#0F172A"/>
  <circle cx="200" cy="180" r="170" fill="#10B981" fill-opacity="0.15" filter="blur(60px)"/>
  <circle cx="620" cy="350" r="190" fill="#06B6D4" fill-opacity="0.18" filter="blur(50px)"/>
  <rect x="60" y="60" width="680" height="380" rx="16" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  
  <g transform="translate(100, 140)">
    <rect width="80" height="80" rx="20" fill="#10B981"/>
    <path d="M25 40C32 25 48 25 55 40C48 55 32 55 25 40Z" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="40" cy="40" r="6" fill="#FFFFFF"/>
    
    <text x="110" y="35" fill="#F8FAFC" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700">Lenis Smooth Scroll</text>
    <text x="110" y="65" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-size="16">부드럽고 묵직한 가속 스크롤과 완벽한 브라우저 호환성</text>
  </g>

  <g transform="translate(100, 260)">
    <rect width="600" height="130" rx="12" fill="#1E293B" stroke="#334155"/>
    <circle cx="25" cy="22" r="5" fill="#EF4444"/>
    <circle cx="42" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="22" r="5" fill="#10B981"/>
    <text x="25" y="60" fill="#34D399" font-family="monospace" font-size="14">const lenis = new Lenis({ duration: 1.2, smoothWheel: true });</text>
    <text x="25" y="85" fill="#E2E8F0" font-family="monospace" font-size="14">lenis.on('scroll', ScrollTrigger.update);</text>
    <text x="25" y="110" fill="#94A3B8" font-family="monospace" font-size="13">// GSAP Ticker와 동기화되어 끊김 없는 스크롤 구현</text>
  </g>
</svg>
