  <!-- Code Preview Box -->
  <g transform="translate(100, 260)">
    <rect width="600" height="130" rx="12" fill="#1E293B" stroke="#334155"/>
    <circle cx="25" cy="22" r="5" fill="#EF4444"/>
    <circle cx="42" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="22" r="5" fill="#10B981"/>
    <text x="25" y="60" fill="#38BDF8" font-family="monospace" font-size="14">gsap.from(".card", {</text>
    <text x="45" y="82" fill="#E2E8F0" font-family="monospace" font-size="14">y: 50, opacity: 0, stagger: 0.15, scrollTrigger: { trigger: ".card-wrap" }</text>
    <text x="25" y="104" fill="#38BDF8" font-family="monospace" font-size="14">});</text>
