<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="20" fill="#0F172A"/>
  <circle cx="650" cy="150" r="180" fill="#3B82F6" fill-opacity="0.15" filter="blur(60px)"/>
  <circle cx="200" cy="380" r="160" fill="#6366F1" fill-opacity="0.2" filter="blur(50px)"/>
  <rect x="60" y="60" width="680" height="380" rx="16" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Icon & Visual -->
  <g transform="translate(100, 140)">
    <rect width="80" height="80" rx="20" fill="#3B82F6"/>
    <path d="M28 40L38 50L54 32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="110" y="35" fill="#F8FAFC" font-family="'Pretendard', sans-serif" font-size="28" font-weight="700">GSAP &amp; ScrollTrigger</text>
    <text x="110" y="65" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-size="16">스크롤 기반 인터랙션 및 프레임 단위 모션 제어</text>
