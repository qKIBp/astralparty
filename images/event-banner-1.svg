<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#2D124D" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="380" rx="20" fill="url(#bg1)" />

  <!-- Cosmic Orbs & Nebula -->
  <circle cx="820" cy="90" r="180" fill="#EC4899" fill-opacity="0.22" filter="blur(60px)" />
  <circle cx="200" cy="300" r="140" fill="#8B5CF6" fill-opacity="0.18" filter="blur(50px)" />
  <rect x="1.5" y="1.5" width="957" height="377" rx="18.5" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Right Graphic: Trophy & Dice (Compact for 380h) -->
  <g transform="translate(630, 45)">
    <circle cx="130" cy="130" r="100" fill="#6366F1" fill-opacity="0.15" />
    <!-- Giant Glowing Trophy -->
    <path d="M90 60H170V120C170 148 152 165 130 165C108 165 90 148 90 120V60Z" fill="url(#goldText)" />
    <path d="M90 75H65C50 75 50 110 68 110H90" stroke="#FDE047" stroke-width="8" stroke-linecap="round" />
    <path d="M170 75H195C210 75 210 110 192 110H170" stroke="#FDE047" stroke-width="8" stroke-linecap="round" />
    <path d="M130 165V200M105 200H155" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" />
    <!-- Floating Dice -->
    <g transform="translate(15, 175) rotate(-12)">
      <rect width="52" height="52" rx="12" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="16" cy="16" r="4" fill="#FFFFFF" />
      <circle cx="36" cy="16" r="4" fill="#FFFFFF" />
      <circle cx="26" cy="26" r="4" fill="#FFFFFF" />
      <circle cx="16" cy="36" r="4" fill="#FFFFFF" />
      <circle cx="36" cy="36" r="4" fill="#FFFFFF" />
    </g>
    <!-- Sparkling Stars -->
    <path d="M210 50L215 64L229 69L215 74L210 88L205 74L191 69L205 64Z" fill="#FDE047" />
    <path d="M40 70L43 79L52 82L43 85L40 94L37 85L28 82L37 79Z" fill="#38BDF8" />
  </g>

  <!-- Left Content Area (Slim & Compact) -->
  <g transform="translate(56, 44)">
    <!-- Event Badge -->
    <rect width="160" height="28" rx="14" fill="#F43F5E" fill-opacity="0.2" stroke="#F43F5E" stroke-width="1.5" />
    <text x="80" y="19" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#FDA4AF" text-anchor="middle">
      ★ SEASON FESTIVAL
    </text>

    <!-- Main Title -->
    <text x="0" y="74" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.03em">
      아스트랄 챔피언십 개막!
    </text>

    <!-- Summary (Single Line) -->
    <text x="0" y="112" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="url(#goldText)" letter-spacing="-0.01em">
      랭킹전에 도전하고 한정 전설 주사위 스킨과 프로필 테두리를 쟁취하세요
    </text>

    <!-- Horizontal Info & Button Row -->
    <g transform="translate(0, 142)">
      <!-- Period Tag -->
      <rect width="210" height="38" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" />
      <text x="14" y="24" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
        📅 2026.11.01 ~ 11.30 (한 달간)
      </text>

      <!-- CTA Button Inline -->
      <g transform="translate(224, 0)">
        <rect width="168" height="38" rx="10" fill="url(#btnGrad)" />
        <text x="84" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">
          이벤트 자세히 보기 →
        </text>
      </g>
    </g>
  </g>
</svg>
