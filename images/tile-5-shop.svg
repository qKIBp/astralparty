<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="tile5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#tile5Bg)" stroke="#F59E0B" stroke-width="2" />

  <g transform="translate(40, 40)">
    <!-- Shop item 1: Star Diamonds -->
    <g transform="translate(10, 20)">
      <rect width="150" height="180" rx="14" fill="#1C1917" stroke="#F59E0B" stroke-width="2" />
      <polygon points="75,40 105,70 75,110 45,70" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
      <text x="75" y="140" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">별빛 다이아</text>
      <text x="75" y="160" font-family="'Pretendard', sans-serif" font-size="11" fill="#FDE68A" text-anchor="middle">뽑기 &amp; 스킨 교환 재화</text>
    </g>

    <!-- Shop item 2: Custom Dice Skins -->
    <g transform="translate(185, 20)">
      <rect width="150" height="180" rx="14" fill="#1C1917" stroke="#F59E0B" stroke-width="2" />
      <rect x="45" y="50" width="60" height="60" rx="12" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="60" cy="65" r="5" fill="#FFFFFF" />
      <circle cx="90" cy="65" r="5" fill="#FFFFFF" />
      <circle cx="75" cy="80" r="5" fill="#FFFFFF" />
      <circle cx="60" cy="95" r="5" fill="#FFFFFF" />
      <circle cx="90" cy="95" r="5" fill="#FFFFFF" />
      <text x="75" y="140" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">한정 주사위 스킨</text>
      <text x="75" y="160" font-family="'Pretendard', sans-serif" font-size="11" fill="#FDE68A" text-anchor="middle">굴릴 때 특별 이펙트</text>
    </g>

    <!-- Shop item 3: Party Pass -->
    <g transform="translate(360, 20)">
      <rect width="150" height="180" rx="14" fill="#1C1917" stroke="#F59E0B" stroke-width="2" />
      <circle cx="75" cy="75" r="32" fill="#B45309" />
      <text x="75" y="85" font-family="'Pretendard', sans-serif" font-size="30" fill="#FDE047" text-anchor="middle">🎫</text>
      <text x="75" y="140" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">시즌 파티 패스</text>
      <text x="75" y="160" font-family="'Pretendard', sans-serif" font-size="11" fill="#FDE68A" text-anchor="middle">전용 코스튬 및 보상</text>
    </g>

    <g transform="translate(30, 220)">
      <text x="240" y="30" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#FEF3C7" text-anchor="middle">
        ※ 게임 내 스팀 지갑(Steam Wallet)을 통해 안전하고 간편하게 결제할 수 있습니다.
      </text>
    </g>
  </g>

  <g transform="translate(180, 310)">
    <rect width="240" height="38" rx="19" fill="#D97706" />
    <text x="120" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      인게임 상점 카탈로그 보기 →
    </text>
  </g>
</svg>
