<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="tile4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#tile4Bg)" stroke="#34D399" stroke-width="2" />

  <g transform="translate(40, 40)">
    <!-- Map Showcase Box 1: Stardust Station -->
    <g transform="translate(10, 20)">
      <rect width="240" height="150" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="2" />
      <!-- Stylized Planet Ring -->
      <circle cx="120" cy="70" r="35" fill="#047857" />
      <ellipse cx="120" cy="70" rx="60" ry="16" fill="none" stroke="#FDE047" stroke-width="3" />
      <!-- Board Tiles line -->
      <circle cx="40" cy="120" r="10" fill="#34D399" />
      <line x1="50" y1="120" x2="80" y2="120" stroke="#34D399" stroke-width="3" />
      <circle cx="90" cy="120" r="10" fill="#FBBF24" />
      <line x1="100" y1="120" x2="130" y2="120" stroke="#34D399" stroke-width="3" />
      <circle cx="140" cy="120" r="10" fill="#F43F5E" />
      <text x="120" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">스타더스트 정거장</text>
    </g>

    <!-- Map Showcase Box 2: Neon Carnival -->
    <g transform="translate(270, 20)">
      <rect width="240" height="150" rx="14" fill="#1E1B4B" stroke="#C084FC" stroke-width="2" />
      <circle cx="120" cy="70" r="38" fill="#581C87" />
      <!-- Ferris Wheel Shape -->
      <circle cx="120" cy="70" r="30" fill="none" stroke="#F472B6" stroke-width="3" stroke-dasharray="6 6" />
      <circle cx="40" cy="120" r="10" fill="#C084FC" />
      <line x1="50" y1="120" x2="80" y2="120" stroke="#C084FC" stroke-width="3" />
      <circle cx="90" cy="120" r="10" fill="#38BDF8" />
      <line x1="100" y1="120" x2="130" y2="120" stroke="#C084FC" stroke-width="3" />
      <circle cx="140" cy="120" r="10" fill="#FBBF24" />
      <text x="120" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">네온 카니발 파크</text>
    </g>

    <g transform="translate(40, 200)">
      <rect width="440" height="60" rx="12" fill="#022C22" stroke="#059669" />
      <text x="20" y="36" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#A7F3D0">
        🗺️ 각 맵마다 고유의 날씨 효과, 기믹 타일, 상점 보너스가 다르게 작동합니다!
      </text>
    </g>
  </g>

  <g transform="translate(180, 310)">
    <rect width="240" height="38" rx="19" fill="#059669" />
    <text x="120" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      맵 기믹 및 루트 공략 보기 →
    </text>
  </g>
</svg>
