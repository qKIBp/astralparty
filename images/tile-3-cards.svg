<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="tile3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#tile3Bg)" stroke="#818CF8" stroke-width="2" />

  <g transform="translate(50, 40)">
    <!-- Card 1: Trap Card -->
    <g transform="translate(10, 20)">
      <rect width="130" height="210" rx="14" fill="#0F172A" stroke="#EF4444" stroke-width="3" />
      <circle cx="65" cy="80" r="30" fill="#7F1D1D" />
      <text x="65" y="88" font-family="'Pretendard', sans-serif" font-size="28" fill="#FCA5A5" text-anchor="middle">💣</text>
      <text x="65" y="145" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">깜짝 지뢰</text>
      <text x="65" y="168" font-family="'Pretendard', sans-serif" font-size="11" fill="#FCA5A5" text-anchor="middle">밟은 대상 코인 30% 압류</text>
      <rect x="25" y="185" width="80" height="6" rx="3" fill="#EF4444" />
    </g>

    <!-- Card 2: Move Dice Card -->
    <g transform="translate(180, 20)">
      <rect width="130" height="210" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="3" />
      <circle cx="65" cy="80" r="30" fill="#1E3A8A" />
      <text x="65" y="88" font-family="'Pretendard', sans-serif" font-size="28" fill="#93C5FD" text-anchor="middle">🎲</text>
      <text x="65" y="145" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">황금 더블 주사위</text>
      <text x="65" y="168" font-family="'Pretendard', sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">다음 턴 주사위 2회 던짐</text>
      <rect x="25" y="185" width="80" height="6" rx="3" fill="#3B82F6" />
    </g>

    <!-- Card 3: Shield Card -->
    <g transform="translate(350, 20)">
      <rect width="130" height="210" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="3" />
      <circle cx="65" cy="80" r="30" fill="#064E3B" />
      <text x="65" y="88" font-family="'Pretendard', sans-serif" font-size="28" fill="#6EE7B7" text-anchor="middle">🛡️</text>
      <text x="65" y="145" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">은하수 방어막</text>
      <text x="65" y="168" font-family="'Pretendard', sans-serif" font-size="11" fill="#6EE7B7" text-anchor="middle">상대의 공격/방해 1회 무효</text>
      <rect x="25" y="185" width="80" height="6" rx="3" fill="#10B981" />
    </g>
  </g>

  <g transform="translate(160, 305)">
    <rect width="280" height="38" rx="19" fill="#4F46E5" />
    <text x="140" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      총 60여 종의 전략 카드 전체보기 →
    </text>
