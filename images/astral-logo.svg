<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Glowing Background Filter -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Stylized Cosmic Dice Icon -->
  <g transform="translate(6, 6)">
    <!-- 3D Isometric Dice -->
    <path d="M24 4L44 14V36L24 46L4 36V14L24 4Z" fill="#1E1B4B" stroke="url(#logoGrad)" stroke-width="2.5" />
    <path d="M24 4L44 14L24 24L4 14L24 4Z" fill="#312E81" />
    <path d="M24 24V46L4 36V14L24 24Z" fill="#1E1B4B" />
    <path d="M24 24L44 14V36L24 46V24Z" fill="#4338CA" />
    
    <!-- Dice Sparkle Star -->
    <circle cx="24" cy="14" r="3" fill="#FBBF24" />
    <circle cx="14" cy="30" r="2.5" fill="#38BDF8" />
    <circle cx="19" cy="38" r="2.5" fill="#38BDF8" />
    <circle cx="34" cy="30" r="2.5" fill="#F43F5E" />
    <circle cx="29" cy="38" r="2.5" fill="#F43F5E" />
  </g>

  <!-- Typography: ASTRAL PARTY -->
  <text x="60" y="32" font-family="'Pretendard', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">
    ASTRAL <tspan fill="url(#logoGrad)">PARTY</tspan>
  </text>
  <text x="62" y="47" font-family="'Pretendard', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="0.15em">
    OFFICIAL STEAM SITE
  </text>
</svg>
